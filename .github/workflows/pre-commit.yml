name: pre-commit

on:
  push:
    branches: [main, feat/57-cursor-authoring-format]
  pull_request:
    branches: [main, feat/57-cursor-authoring-format]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1
      - name: run pre-commit hooks
        run: nix develop --command pre-commit run --all-files
