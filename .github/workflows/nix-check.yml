name: nix check

on:
  push:
    branches: [main, feat/57-cursor-authoring-format]
  pull_request:
    branches: [main, feat/57-cursor-authoring-format]
  workflow_dispatch:

jobs:
  nix-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1
      - name: nix flake check
        run: nix flake check
